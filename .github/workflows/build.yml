name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      accept_minecraft_eula:
        description: 'I accept https://www.minecraft.net/eula and want disposable Paper smoke tests'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify checked-in Gradle Wrapper
        shell: python
        run: |
          from pathlib import Path
          from hashlib import sha256
          expected = '621008afc4f5d59357fcf06ffa644dd5aade5e091bdc363742710445f73cdaf8'
          actual = sha256(Path('gradle/wrapper/gradle-wrapper.jar').read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit('Gradle Wrapper checksum mismatch')
      - name: Build and test
        shell: bash
        run: bash ./gradlew clean build --no-daemon --console=plain
      - name: Run opt-in Paper smoke tests
        if: github.event_name == 'workflow_dispatch' && inputs.accept_minecraft_eula
        shell: bash
        run: bash ./gradlew paperIntegrationTest -PacceptMinecraftEula=true --no-daemon --console=plain
      - name: Retain build artifacts and test evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: chronicle-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/libs/*.jar
            build/reports/tests/test/**
            build/test-results/test/*.xml
            build/paper-tests/*/console.log
